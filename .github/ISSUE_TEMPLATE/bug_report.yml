name: Bug 报告
description: 报告可以稳定复现的问题
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 感谢反馈。请勿在 Issue 中粘贴 API Key、儿童真实姓名或其他个人数据。
  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 实际发生了什么？你原本期望什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 看到……
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      description: 浏览器/Android 版本、设备和提交版本
      placeholder: Edge 136 / Windows 11，或 Android 14
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 可添加已脱敏的截图、日志或其他背景。
